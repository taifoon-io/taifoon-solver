[package]
name = "solver-main"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "solver_main"
path = "src/lib.rs"

[[bin]]
name = "taifoon-solver"
path = "src/main.rs"

[[bin]]
name = "estimate_one"
path = "src/bin/estimate_one.rs"

[dependencies]
genome-client = { path = "../genome-client" }
portfolio-sidecar = { path = "../portfolio-sidecar" }
profit-calc = { path = "../profit-calc" }
executor = { path = "../executor" }
protocol-adapters = { path = "../protocol-adapters" }
solver-api = { path = "../solver-api" }
donut-adjudicator = { path = "../donut-adjudicator" }
taifoon-arb-bridge = { path = "../taifoon-arb-bridge" }
wallet-manager = { path = "../wallet-manager" }
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
alloy.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
async-trait.workspace = true
toml = "0.8"

[features]
# Default build is config-only: TraderHandBackend answers /api/hand/* from a
# hands.toml without needing the gitignored internal `trader` crate, so
# `cargo build -p solver-main` works on a fresh checkout.
default = []
# Enable when the internal venue's `trader` crate is checked out at
# ../trade/crates/trader. Add the path dep alongside flipping this on:
#   trader = { path = "../../../trade/crates/trader", optional = true }
# and reference it from this feature (trader-backend = ["dep:trader"]).
trader-backend = []
